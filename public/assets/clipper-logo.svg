<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" width="400" height="120">
  <!-- Charcoal Background Matching Official Brand Canvas -->
  <rect width="400" height="120" rx="16" fill="#0D0E10"/>
  
  <!-- Clipper Aperture Symbol -->
  <g transform="translate(36, 28)">
    <!-- Symbol Container Surface -->
    <rect width="64" height="64" rx="14" fill="#141516" stroke="#3A3C3F" stroke-width="1.5"/>
    
    <!-- Precision Faceted Mark (Off-white & Silver metallic gradient) -->
    <g transform="translate(8, 8) scale(1.5)">
      <defs>
        <linearGradient id="clipper-svg-sheen" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="45%" stop-color="#C7C9CC" />
          <stop offset="75%" stop-color="#92969C" />
          <stop offset="100%" stop-color="#686B70" />
        </linearGradient>
        <linearGradient id="clipper-svg-notch" x1="16" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#3A3C3F" />
        </linearGradient>
      </defs>
      
      <!-- Faceted Cut "C" Arch -->
      <path
        d="M23 10.5C21.2 8.5 18.5 7.2 15.5 7.2C10.2 7.2 6 11.2 6 16C6 20.8 10.2 24.8 15.5 24.8C18.5 24.8 21.2 23.5 23 21.5L19.2 18.5C18.2 19.8 16.9 20.6 15.5 20.6C12.7 20.6 10.5 18.5 10.5 16C10.5 13.5 12.7 11.4 15.5 11.4C16.9 11.4 18.2 12.2 19.2 13.5L23 10.5Z"
        fill="url(#clipper-svg-sheen)"
      />
      <!-- Razor Notch -->
      <rect
        x="20.5"
        y="14.5"
        width="5"
        height="3"
        rx="1"
        transform="rotate(-25 20.5 14.5)"
        fill="url(#clipper-svg-notch)"
        opacity="0.9"
      />
    </g>
  </g>
  
  <!-- Off-white Clipper Wordmark -->
  <text
    x="124"
    y="70"
    fill="#F2F2F0"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="2.5"
  >CLIPPER</text>
  
  <!-- Subtitle Descriptor -->
  <text
    x="126"
    y="90"
    fill="#777A7E"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="1.5"
  >CINEMATIC VIDEO STUDIO</text>
</svg>
